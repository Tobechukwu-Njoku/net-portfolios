name: Docker image

# Builds the image on every push to main and on version tags, and publishes it to
# GitHub Container Registry as ghcr.io/<owner>/net-portfolios. Pull requests only build.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Smoke test (server starts and serves the page)
        run: |
          npm ci --omit=dev
          PORT=18080 PHOTOS_DIR="$RUNNER_TEMP/photos" node server.js &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:18080/content.js >/dev/null && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:18080/ | grep -q '<title>'
          curl -fsS http://127.0.0.1:18080/content.js | grep -q 'window.PORTFOLIO'

      - name: Image name (registry names must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/net-portfolios" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
